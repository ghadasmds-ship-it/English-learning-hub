name: Validate English Learning Hub
on:
  push:
    branches: [fix/auth-tenant-isolation]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run lint
      - run: bun run build
