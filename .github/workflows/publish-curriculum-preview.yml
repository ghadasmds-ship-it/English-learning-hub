name: Publish safe curriculum preview
# Fresh deployment attempt after Pages branch rule update.
on:
  push:
    branches: [fix/auth-tenant-isolation]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: english-learning-hub-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Typecheck
        run: bun run lint
      - name: Build preview with correct subpath
        run: bun run build -- --base=/English-learning-hub/
        env:
          VITE_ENABLE_DEMO: 'false'
      - name: Upload downloadable preview build
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-preview-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
